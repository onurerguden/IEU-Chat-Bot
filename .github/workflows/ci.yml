name: Course Intelligence CI
on: [pull_request, push]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install qdrant-client==1.16.2 pytest
      - run: python -m pytest -q
      - run: python -m course_intelligence.benchmark --mode bm25 --output /tmp/course-bm25.json
